<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Primary SEO -->
    <meta
      name="description"
      content="Track parcels and shipments from different courier companies around the world with ParcelTracker. Get delivery updates and check your package status in one place."
    />

    <meta
      name="keywords"
      content="ParcelTracker, parcel tracking, package tracking, shipment tracking, track my parcel, international parcel tracking, courier tracking, delivery status, global package tracker"
    />

    <meta name="author" content="ParcelTracker" />
    <meta name="robots" content="index, follow" />

    <!-- Bootstrap CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- Canonical URL: Replace with your actual domain -->
    <link rel="canonical" href="https://yourdomain.com/" />

    <!-- Favicon and App Icons -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="ParcelTracker | Track Parcels Worldwide"
    />
    <meta
      property="og:description"
      content="Track your parcels and shipments from different courier companies in one convenient place."
    />
    <meta property="og:url" content="https://yourdomain.com/" />
    <meta
      property="og:image"
      content="https://yourdomain.com/parceltracker-social.png"
    />
    <meta property="og:site_name" content="ParcelTracker" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="ParcelTracker | Track Parcels Worldwide"
    />
    <meta
      name="twitter:description"
      content="Follow your parcel's journey with ParcelTracker. Check shipment status and delivery updates in one place."
    />
    <meta
      name="twitter:image"
      content="https://yourdomain.com/parceltracker-social.png"
    />

    <!-- Page Title -->
    <title>ParcelTracker | Track Parcels and Shipments Worldwide</title>
  </head>
